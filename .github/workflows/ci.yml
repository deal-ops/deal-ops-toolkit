name: CI
on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Shared design variables (tokens.css hash, shared with Deal Ops Inbox)
        run: npm run check:tokens
      - name: Lint
        run: npm run lint
      - name: Oracle self-check (independent Python implementation)
        run: npm run oracle:selfcheck
      - name: Unit, invariant and TS-vs-oracle tests + milestone coverage
        run: npm run coverage:check
      - name: Build
        run: npm run build
      - name: Project website checks (CSP markup, links, app sentences, P9 figures, script build and size, clips ≤ 5 s)
        run: npm run site:check
      - name: Let apt wait for the dpkg lock
        # the runner's own apt jobs can hold the lock at start-up ("Could not get lock /var/lib/dpkg/lock-frontend"); make every
        # apt-get call, including Playwright's, wait up to 5 minutes for it instead of failing (apt's DPkg::Lock::Timeout, 2026-10-27)
        run: echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99-dpkg-lock-timeout
      - name: Install Playwright browser
        # the system-package step sometimes hangs on the runner: cap each try at 3 minutes and retry once (Rules G2a, 2026-10-23)
        timeout-minutes: 14
        run: timeout 360 npx playwright install --with-deps chromium || timeout 360 npx playwright install --with-deps chromium
      - name: End-to-end tests (production build, production CSP) + milestone coverage
        run: npm run e2e:check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
